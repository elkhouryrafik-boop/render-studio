[project]
name = "render-studio"
version = "0.1.0"
description = "AI rendering studio for architects: floorplans, sketches, massing and CAD files to presentation renders via fal.ai"
requires-python = ">=3.11"
dependencies = [
    "fal-client>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "ezdxf>=1.3.0",
    "pymupdf>=1.24.0",
    "ifcopenshell>=0.8.0",
    "trimesh>=4.0.0",
    "pyrender>=0.1.45",
    "openskp>=0.3.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests (Playwright, fake engine). Skipped unless RUN_E2E=1.",
]

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for the CAD renderers
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libosmesa6
      - run: uv sync --frozen
      - run: uv run ruff check app api tests
      - run: uv run python -m pytest -q
        env:
          PYRENDER_GL_BACKEND: osmesa
          RENDER_ENGINE: fake

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t render-studio .
